# Task 13.1 (local stack): nginx config template (nginx's official image
# runs `envsubst` on every file under `/etc/nginx/templates/*.template` at
# container start, rendering it to `/etc/nginx/conf.d/<name>.conf`).
# `${BFF_UPSTREAM}` is the only substituted variable — `docker-compose.yml`
# sets `NGINX_ENVSUBST_FILTER=BFF_UPSTREAM` on the `web` service so every
# other `$...` token below (nginx's own request variables) is left alone.
#
# Reproduces design Decision 2's same-origin requirement locally: web and the
# BFF share one origin so the onboard captive portal only has to zero-rate
# one domain (Decision 9) and cookies stay first-party. `/internal/*` is
# deliberately NOT proxied here — design-interfaces documents
# `POST /internal/links` as "service-authenticated... not internet-exposed
# via CDN"; call it directly against the `bff-api` container's own exposed
# port instead (see root `docker-compose.yml`'s comments).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${BFF_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://${BFF_UPSTREAM}/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://${BFF_UPSTREAM}/healthz;
    }

    # The app shell itself is never cached, so the service worker's own
    # update check always sees a fresh pointer to the latest hashed build
    # assets (design Decision 5's versioned precache, task 4.6).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output hashes every asset filename, so these are safe to
    # cache immutably for a very long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any unmatched path (e.g. a deep link like `/t`) serves
    # `index.html` so the client-side router (TanStack Router) resolves it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
